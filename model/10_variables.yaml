# ---------------------------------------------------------------------------
# VARIABLES: raw measured inputs (one reporting period = one pilot week).
# Values here are an ILLUSTRATIVE baseline. Override with real data via
#   --values data/your_period.yaml   (or .csv with columns id,value)
#
# Fields:  value, unit, type (float|int|ratio|bool|...), domain, stage,
#          source (ERP|MES|WMS|QMS|PLC|HRIS|manual|...), description,
#          dist (optional, for Monte Carlo prediction):
#             {type: normal, sd: X, min: , max: }
#             {type: triangular, low: , high: , mode: }   (mode defaults to value)
#             {type: uniform, low: , high: }
#          attributes: {any custom key: value}   -> exported to the ontology
# ---------------------------------------------------------------------------

